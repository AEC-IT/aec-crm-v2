services:
  - type: web
    name: aec-crm-v2
    runtime: python
    plan: starter          # paid plan = no sleeping / slow wake-ups
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase: {name: aec-crm-db, property: connectionString}
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: UPI_ID
        sync: false
      - key: UPI_NAME
        value: AEC Studies Pvt Ltd
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 5
databases:
  - name: aec-crm-db
    plan: basic-256mb      # daily backups included on paid Postgres
