{% extends "base.html" %}{% block title %}Verify{% endblock %}
{% block public %}
<div style="min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0f1b2d,#0b5cad)">
<form method="post" class="card" style="width:360px;padding:28px"><h1>2-step login</h1>
<p class="sub">Open Google Authenticator (or Microsoft Authenticator) and type the 6-digit code for <b>AEC CRM</b>.</p>
<input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" required autofocus style="width:100%;font-size:22px;letter-spacing:6px;text-align:center">
<button class="btn" style="width:100%;margin-top:14px">Verify</button>
<p class="small muted" style="margin-top:14px">Lost your phone? Ask an admin to reset your 2-step login.</p></form></div>
{% endblock %}
