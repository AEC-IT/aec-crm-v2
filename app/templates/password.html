{% extends "base.html" %}{% block title %}Change password{% endblock %}
{% block content %}
<h1>Change password</h1>
<form method="post" class="card" style="max-width:380px"><label>Current password</label><input type="password" name="current" required style="width:100%;margin-bottom:10px">
<label>New password (8+ characters)</label><input type="password" name="new" minlength="8" required style="width:100%;margin-bottom:12px"><button class="btn">Change</button></form>
{% endblock %}
